server {
    listen 9292 ssl;
    server_name _;

    ssl_certificate     /etc/pki/tls/certs/impala_hub.crt;
    ssl_certificate_key /etc/pki/tls/private/impala_hub.key;

    root /opt/impala_hub;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
